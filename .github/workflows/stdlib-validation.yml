name: Public stdlib validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'research/**'
      - '.github/workflows/stdlib-validation.yml'
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'research/**'
      - '.github/workflows/stdlib-validation.yml'

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out public source (pinned, no persisted credential)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run existing offline standard-library regressions
        run: |
          python3 -m unittest discover -s examples -p 'test_*.py' -v
          python3 -m unittest discover -s research -p 'test_*.py' -v
